<!-- ======================== 启动画面 ======================== -->
<div id="boot" class="boot"><div class="spinner xl"></div></div>

<!-- ======================== 登录 / 注册 ======================== -->
<div id="login-view" class="login-view hidden">
  <div class="login-card">
    <div class="brand">
      <span class="brand-mark"><svg class="icon"><use href="#i-cloud"></use></svg></span>
      <span class="brand-text"><b>云盘 NetDisk</b><span>安全 · 简单 · 快速</span></span>
    </div>
    <p class="login-sub">登录后管理你的文件、分享与回收站</p>

    <div class="auth-tabs" id="auth-tabs">
      <div class="auth-tab-slider"></div>
      <button class="auth-tab active" type="button" data-mode="login">登录</button>
      <button class="auth-tab" type="button" data-mode="register">注册</button>
    </div>

    <div id="auth-error" class="auth-error hidden">
      <svg class="icon"><use href="#i-alert"></use></svg>
      <span id="auth-error-text"></span>
    </div>

    <form id="auth-form" autocomplete="off">
      <div class="field">
        <label for="auth-username">用户名</label>
        <div class="input-wrap">
          <svg class="icon"><use href="#i-user"></use></svg>
          <input class="input" id="auth-username" name="username" placeholder="请输入用户名" maxlength="64" required>
        </div>
      </div>
      <div class="field" id="email-field" style="display:none">
        <label for="auth-email">邮箱</label>
        <div class="input-wrap">
          <svg class="icon"><use href="#i-mail"></use></svg>
          <input class="input" id="auth-email" name="email" type="email" placeholder="you@example.com">
        </div>
      </div>
      <div class="field">
        <label for="auth-password">密码</label>
        <div class="input-wrap">
          <svg class="icon"><use href="#i-lock"></use></svg>
          <input class="input" id="auth-password" name="password" type="password" placeholder="请输入密码" required>
        </div>
      </div>
      <button class="btn btn-primary btn-lg btn-block" id="auth-submit" type="submit">登 录</button>
    </form>

    <p class="login-foot">NetDisk · Go + Echo 实现的个人网盘</p>
  </div>
</div>

<!-- ======================== 主应用 ======================== -->
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark"><svg class="icon"><use href="#i-cloud"></use></svg></span>
      <span class="brand-text"><b>云盘 NetDisk</b><span>个人云存储</span></span>
    </div>

    <nav class="nav">
      <a class="nav-item" href="#/files" data-nav="files" title="我的文件">
        <svg class="icon"><use href="#i-folder"></use></svg><span>我的文件</span>
      </a>
      <a class="nav-item" href="#/shares" data-nav="shares" title="我的分享">
        <svg class="icon"><use href="#i-share"></use></svg><span>我的分享</span>
        <span class="nav-count hidden" id="shares-count"></span>
      </a>
      <a class="nav-item" href="#/trash" data-nav="trash" title="回收站">
        <svg class="icon"><use href="#i-trash"></use></svg><span>回收站</span>
        <span class="nav-count hidden" id="trash-count"></span>
      </a>
    </nav>

    <div class="sidebar-bottom">
      <div class="storage-card">
        <div class="storage-head"><span>存储空间</span><b id="storage-text">—</b></div>
        <div class="progress"><div class="progress-bar" id="storage-bar"></div></div>
        <div class="storage-hint" id="storage-hint">加载中…</div>
      </div>
      <div class="user-card">
        <span class="avatar" id="user-avatar">?</span>
        <span class="user-meta"><b id="user-name">—</b><span id="user-email"></span></span>
        <button class="icon-btn" id="logout-btn" title="退出登录" aria-label="退出登录">
          <svg class="icon"><use href="#i-logout"></use></svg>
        </button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar" id="topbar"></header>
    <section class="content" id="content"></section>
  </main>
</div>

<!-- ======================== 浮层 ======================== -->
<div id="drop-overlay" class="drop-overlay hidden">
  <div class="drop-box">
    <svg class="icon"><use href="#i-upload"></use></svg>
    松开即可上传到当前文件夹
  </div>
</div>
<div id="uploader-root" class="uploader-panel"></div>
<div id="modal-root"></div>
<div id="toast-root" class="toast-stack"></div>
<input type="file" id="file-input" multiple hidden>

<script src="app.js?v=5"></script>
</body>
</html>
